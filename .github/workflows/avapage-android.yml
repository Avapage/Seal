name: Build Klip APK
on:
  push:
    branches: [avapage-downloader]
    paths: ['avapage-downloader/**', '.github/workflows/avapage-android.yml']
  pull_request:
    paths: ['avapage-downloader/**', '.github/workflows/avapage-android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle --no-daemon :app:assembleDebug
        working-directory: avapage-downloader
      - uses: actions/upload-artifact@v4
        with:
          name: Klip-debug
          path: avapage-downloader/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish direct APK downloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/avapage-downloader'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/avapage-downloader" --jq .sha)"
          if [ "$current" != "$GITHUB_SHA" ]; then echo "Skipping outdated build"; exit 0; fi
          mkdir -p /tmp/klip-apks
          cp avapage-downloader/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk /tmp/klip-apks/Klip-0.2.3-ARM64.apk
          cp avapage-downloader/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk /tmp/klip-apks/Klip-0.2.3-ARMv7.apk
          cp avapage-downloader/app/build/outputs/apk/debug/app-x86_64-debug.apk /tmp/klip-apks/Klip-0.2.3-x86_64.apk
          cp avapage-downloader/app/build/outputs/apk/debug/app-universal-debug.apk /tmp/klip-apks/Klip-0.2.3-Universal.apk
          cat > /tmp/klip-notes.md <<'NOTES'
          ## Klip untuk Android
          Klip membantu menyimpan video dan audio langsung di perangkat. Android 10 atau lebih baru diperlukan.

          ### Pilih APK
          - **ARM64:** untuk kebanyakan HP Android modern, termasuk Xiaomi 14.
          - **ARMv7:** untuk perangkat 32-bit yang kompatibel.
          - **x86_64:** untuk perangkat atau emulator x86-64.
          - **Universal:** bila tidak yakin, mencakup ketiga arsitektur di atas.

          ### Fitur
          Pilihan kualitas video dan audio, pengecekan info video, browser untuk mendeteksi sebagian media, pembatalan, dan pembaruan mesin yt-dlp. Proses berjalan di perangkat, tanpa server unduhan milik Klip.

          ### Instalasi
          Unduh APK yang sesuai, buka file itu dan izinkan instalasi dari sumber tersebut jika diminta Android. Ini adalah versi **debug/pratinjau**, belum diuji di seluruh perangkat. Jika pembaruan ditolak karena tanda tangan berbeda, hapus versi lama lebih dulu; unduhan yang sudah ada di Downloads tidak ikut dihapus oleh aplikasi.

          Tidak semua website atau video didukung. Sumber yang memerlukan autentikasi khusus, perlindungan DRM atau perubahan pada situs dapat gagal. Untuk unduhan, buka aplikasi dan biarkan tetap terbuka. Gunakan hanya untuk konten yang boleh diunduh.
          NOTES
          if gh release view klip-v0.2.3 >/dev/null 2>&1; then
            gh release upload klip-v0.2.3 /tmp/klip-apks/*.apk --clobber
          else
            gh release create klip-v0.2.3 /tmp/klip-apks/*.apk --target "$GITHUB_SHA" --prerelease --title "Klip 0.2.3 untuk Android" --notes-file /tmp/klip-notes.md
          fi
