name: Build AvaDownload APK
on:
  push:
    branches: [avapage-downloader]
    paths: ['avapage-downloader/**', '.github/workflows/avapage-android.yml']
  pull_request:
    paths: ['avapage-downloader/**', '.github/workflows/avapage-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle --no-daemon :app:assembleDebug
        working-directory: avapage-downloader
      - uses: actions/upload-artifact@v4
        with:
          name: AvaDownload-debug
          path: avapage-downloader/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
